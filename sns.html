<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SNS QLUX — On-Chain Social Hub (Twetch Killer)</title>
    <style>
        :root {
            --bg-deep: #020206; --surface: #090914; --surface-hover: #121226;
            --accent-cyan: #00f2fe; --accent-gold: #f3ba2f; --accent-magenta: #ff007f;
            --text-primary: #f5f5fc; --text-secondary: #8c8cbc; --border-color: rgba(255, 255, 255, 0.08);
        }
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Inter', sans-serif; }
        body { background-color: var(--bg-deep); color: var(--text-primary); min-height: 100vh; display: flex; flex-direction: column; }
        header { background: var(--surface); border-bottom: 1px solid var(--border-color); padding: 16px 32px; display: flex; justify-content: space-between; align-items: center; position: sticky; top: 0; z-index: 1000; }
        .brand { display: flex; align-items: center; gap: 14px; }
        .brand-logo { width: 44px; height: 44px; background: linear-gradient(135deg, var(--accent-magenta), var(--accent-cyan)); border-radius: 12px; display: flex; align-items: center; justify-content: center; font-weight: 900; font-size: 1.4rem; color: #fff; }
        .brand-title h1 { font-size: 1.1rem; font-weight: 900; background: linear-gradient(90deg, #fff, var(--accent-magenta)); -webkit-background-clip: text; -webkit-text-fill-color: transparent; }
        .brand-title p { font-size: 0.5rem; color: var(--text-secondary); letter-spacing: 0.15em; }
        .nav-tabs { background: var(--surface); border-bottom: 1px solid var(--border-color); padding: 12px 32px; display: flex; gap: 10px; }
        .nav-tab { background: var(--surface-hover); border: 1px solid var(--border-color); color: var(--text-secondary); padding: 10px 18px; border-radius: 10px; font-size: 0.82rem; font-weight: 700; text-decoration: none; transition: 0.3s; }
        .nav-tab.active, .nav-tab:hover { border-color: var(--accent-magenta); color: var(--text-primary); background: rgba(255,0,127,0.1); }
        main { flex: 1; max-width: 1200px; width: 100%; margin: 0 auto; padding: 32px; display: flex; flex-direction: column; gap: 24px; }
        .card { background: var(--surface); border: 1px solid var(--border-color); border-radius: 18px; padding: 32px; display: flex; flex-direction: column; gap: 20px; }
        .card-header { font-size: 0.9rem; font-weight: 900; color: var(--accent-magenta); text-transform: uppercase; letter-spacing: 0.1em; }
        .sns-box { background: var(--bg-deep); border: 1px solid var(--border-color); border-radius: 14px; padding: 18px; display: flex; flex-direction: column; gap: 12px; }
        .sns-textarea { background: transparent; border: none; color: var(--text-primary); font-size: 0.95rem; resize: none; height: 100px; outline: none; }
        .sns-post-btn { background: linear-gradient(135deg, var(--accent-magenta), var(--accent-cyan)); color: #fff; border: none; padding: 10px 24px; border-radius: 10px; font-weight: 900; font-size: 0.85rem; cursor: pointer; align-self: flex-end; }
        .feed-list { display: flex; flex-direction: column; gap: 14px; }
        .feed-card { background: var(--surface-hover); border: 1px solid var(--border-color); border-radius: 14px; padding: 20px; display: flex; flex-direction: column; gap: 12px; }
        .feed-header { display: flex; justify-content: space-between; align-items: center; font-size: 0.9rem; color: var(--accent-cyan); font-weight: 700; }
        .feed-body { font-size: 0.95rem; color: var(--text-primary); }
        .feed-actions { display: flex; gap: 24px; border-top: 1px solid var(--border-color); padding-top: 12px; font-size: 0.8rem; color: var(--text-secondary); }
        .feed-action-btn { background: transparent; border: none; color: var(--text-secondary); cursor: pointer; font-weight: 700; }
        .feed-action-btn:hover { color: var(--accent-magenta); }
        footer { text-align: center; padding: 24px; font-size: 0.75rem; color: var(--text-secondary); border-top: 1px solid var(--border-color); background: var(--surface); }
    </style>
</head>

    </main>
    <footer>&copy; 2026 QLUX Sovereign Matrix. All Rights Reserved.</footer>
</body>
</html>
