<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>QLUX Wallet — Sovereign Atomic Asset Core</title>
    <style>
        :root {
            --bg-deep: #020206; --surface: #090914; --surface-hover: #121226;
            --accent-cyan: #00f2fe; --accent-gold: #f3ba2f; --accent-magenta: #ff007f;
            --text-primary: #f5f5fc; --text-secondary: #8c8cbc; --border-color: rgba(255, 255, 255, 0.08);
        }
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Inter', sans-serif; }
        body { background-color: var(--bg-deep); color: var(--text-primary); min-height: 100vh; display: flex; flex-direction: column; }
        header { background: var(--surface); border-bottom: 1px solid var(--border-color); padding: 16px 32px; display: flex; justify-content: space-between; align-items: center; position: sticky; top: 0; z-index: 1000; }
        .brand { display: flex; align-items: center; gap: 14px; }
        .brand-logo { width: 44px; height: 44px; background: linear-gradient(135deg, var(--accent-gold), var(--accent-cyan)); border-radius: 12px; display: flex; align-items: center; justify-content: center; font-weight: 900; font-size: 1.4rem; color: #000; }
        .brand-title h1 { font-size: 1.1rem; font-weight: 900; background: linear-gradient(90deg, #fff, var(--accent-gold)); -webkit-background-clip: text; -webkit-text-fill-color: transparent; }
        .brand-title p { font-size: 0.5rem; color: var(--text-secondary); letter-spacing: 0.15em; }
        .nav-tabs { background: var(--surface); border-bottom: 1px solid var(--border-color); padding: 12px 32px; display: flex; gap: 10px; }
        .nav-tab { background: var(--surface-hover); border: 1px solid var(--border-color); color: var(--text-secondary); padding: 10px 18px; border-radius: 10px; font-size: 0.82rem; font-weight: 700; text-decoration: none; transition: 0.3s; }
        .nav-tab.active, .nav-tab:hover { border-color: var(--accent-gold); color: var(--text-primary); background: rgba(243,186,47,0.1); }
        main { flex: 1; max-width: 1200px; width: 100%; margin: 0 auto; padding: 32px; display: flex; flex-direction: column; gap: 24px; }
        .card { background: var(--surface); border: 1px solid var(--border-color); border-radius: 18px; padding: 32px; display: flex; flex-direction: column; gap: 20px; }
        .card-header { font-size: 0.9rem; font-weight: 900; color: var(--accent-gold); text-transform: uppercase; letter-spacing: 0.1em; }
        .wallet-display { background: linear-gradient(135deg, rgba(243,186,47,0.08), rgba(0,242,254,0.04)); border: 1px solid var(--accent-gold); border-radius: 16px; padding: 32px; display: flex; flex-direction: column; gap: 10px; align-items: center; text-align: center; }
        .wallet-balance { font-size: 3rem; font-weight: 900; color: var(--accent-gold); text-shadow: 0 0 25px rgba(243,186,47,0.4); }
        .wallet-btn { background: linear-gradient(135deg, var(--accent-gold), var(--accent-cyan)); color: #000; border: none; padding: 12px 28px; border-radius: 12px; font-weight: 900; font-size: 0.9rem; cursor: pointer; margin-top: 10px; }
        footer { text-align: center; padding: 24px; font-size: 0.75rem; color: var(--text-secondary); border-top: 1px solid var(--border-color); background: var(--surface); }
    </style>
</head>
<body>
    <header>
        <div class="brand">
            <div class="brand-logo">💳</div>
            <div class="brand-title">
                <h1>QLUX WALLET</h1>
                <p>ATOMIC ASSET MANAGEMENT CORE</p>
            </div>
        </div>
        <div style="font-size: 0.8rem; color: var(--accent-gold); font-weight: 700;">● HandCash / 秘密鍵連携済</div>
    </header>
    <nav class="nav-tabs">
        <a href="index.html" class="nav-tab">⚡ メインポータル</a>
        <a href="sns.html" class="nav-tab">🌐 SNS QLUX</a>
        <a href="wallet.html" class="nav-tab active">💳 QLUX Wallet</a>
        <a href="economy.html" class="nav-tab">📊 無人マイクロ経済</a>
    </nav>
    <main>
        <div class="card">
            <div class="card-header">Sovereign Asset Balance</div>
            <div class="wallet-display">
                <span style="font-size: 0.8rem; color: var(--text-secondary); letter-spacing: 0.1em;">CURRENT SOVEREIGN BALANCE</span>
                <div class="wallet-balance" id="mainWalletBalance">742,300 SAT</div>
                <span style="font-size: 0.85rem; color: var(--accent-cyan);">HandCash Connect リアルタイム同期中</span>
                <button class="wallet-btn" onclick="alert('⚡ ウォレットのナノペイメント出金が正常にブロードキャストされました！')">資産を一括オンチェーン送金する</button>
            </div>
        </div>
    </main>
    <footer>&copy; 2026 QLUX Sovereign Matrix. All Rights Reserved.</footer>
</body>
</html>
