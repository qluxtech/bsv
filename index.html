<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>QLUX — Supreme BSV Neural Megalopolis</title>
    <style>
        :root {
            --bg-deep: #030308;
            --surface: #0a0a16;
            --surface-hover: #121224;
            --accent-cyan: #00f2fe;
            --accent-gold: #f3ba2f;
            --accent-magenta: #ff007f;
            --accent-green: #00ff66;
            --text-primary: #f8f8fc;
            --text-secondary: #9898b8;
            --border-color: rgba(255, 255, 255, 0.08);
            --glow-gold: rgba(243, 186, 47, 0.3);
            --glow-cyan: rgba(0, 242, 254, 0.3);
            --glow-magenta: rgba(255, 0, 127, 0.3);
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Inter', system-ui, -apple-system, sans-serif;
        }

        body {
            background-color: var(--bg-deep);
            color: var(--text-primary);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
        }

        /* ヘッダー */
        header {
            background: var(--surface);
            border-bottom: 1px solid var(--border-color);
            padding: 16px 28px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            position: sticky;
            top: 0;
            z-index: 1000;
            backdrop-filter: blur(24px);
        }

        .brand {
            display: flex;
            align-items: center;
            gap: 14px;
        }

        .brand-logo {
            width: 44px;
            height: 44px;
            background: linear-gradient(135deg, var(--accent-gold), var(--accent-cyan));
            border-radius: 12px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: 900;
            font-size: 1.5rem;
            color: #000;
            box-shadow: 0 0 25px var(--glow-gold);
        }

        .brand-title h1 {
            font-size: 1.2rem;
            font-weight: 900;
            letter-spacing: 0.1em;
            background: linear-gradient(90deg, #fff, var(--accent-gold));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .brand-title p {
            font-size: 0.55rem;
            color: var(--text-secondary);
            letter-spacing: 0.15em;
        }

        /* 認証・ウォレット接続ステータス */
        .auth-container {
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .auth-status-badge {
            background: rgba(0, 255, 102, 0.1);
            border: 1px solid var(--accent-green);
            padding: 8px 16px;
            border-radius: 20px;
            font-size: 0.75rem;
            color: var(--accent-green);
            font-weight: 700;
            display: flex;
            align-items: center;
            gap: 6px;
        }

        .auth-btn {
            background: linear-gradient(135deg, var(--accent-gold), var(--accent-magenta));
            color: #fff;
            border: none;
            padding: 9px 18px;
            border-radius: 10px;
            font-weight: 900;
            font-size: 0.8rem;
            cursor: pointer;
            transition: all 0.3s;
            box-shadow: 0 4px 15px rgba(243, 186, 47, 0.3);
        }

        .auth-btn:hover { transform: translateY(-2px); box-shadow: 0 6px 25px var(--glow-gold); }

        /* ナビゲーションタブ */
        .nav-tabs {
            background: var(--surface);
            border-bottom: 1px solid var(--border-color);
            padding: 12px 28px;
            display: flex;
            gap: 10px;
            overflow-x: auto;
            white-space: nowrap;
        }

        .nav-tab {
            background: var(--surface-hover);
            border: 1px solid var(--border-color);
            color: var(--text-secondary);
            padding: 10px 18px;
            border-radius: 10px;
            font-size: 0.8rem;
            font-weight: 700;
            cursor: pointer;
            transition: all 0.3s;
            text-decoration: none;
            display: inline-flex;
            align-items: center;
            gap: 6px;
        }

        .nav-tab:hover, .nav-tab.active {
            background: linear-gradient(135deg, rgba(243,186,47,0.15), rgba(0,242,254,0.15));
            border-color: var(--accent-gold);
            color: var(--text-primary);
            box-shadow: 0 0 15px var(--glow-gold);
        }

        /* メインキャンバス */
        main {
            flex: 1;
            max-width: 1280px;
            width: 100%;
            margin: 0 auto;
            padding: 28px;
            display: flex;
            flex-direction: column;
            gap: 24px;
        }

        .card {
            background: var(--surface);
            border: 1px solid var(--border-color);
            border-radius: 18px;
            padding: 28px;
            display: flex;
            flex-direction: column;
            gap: 20px;
            box-shadow: 0 12px 40px rgba(0,0,0,0.7);
            position: relative;
            overflow: hidden;
        }

        .card::before {
            content: '';
            position: absolute;
            top: 0; left: 0; width: 4px; height: 100%;
            background: linear-gradient(to bottom, var(--accent-gold), var(--accent-cyan));
        }

        .card-header {
            font-size: 0.9rem;
            font-weight: 900;
            color: var(--accent-gold);
            text-transform: uppercase;
            letter-spacing: 0.12em;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .grid-3 {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(260px, 1fr));
            gap: 20px;
        }

        .metric-box {
            background: linear-gradient(135deg, rgba(243,186,47,0.04), rgba(0,242,254,0.02));
            border: 1px solid var(--border-color);
            border-radius: 14px;
            padding: 20px;
            display: flex;
            flex-direction: column;
            gap: 6px;
        }

        .metric-label {
            font-size: 0.7rem;
            color: var(--text-secondary);
            text-transform: uppercase;
            letter-spacing: 0.08em;
        }

        .metric-value {
            font-size: 1.8rem;
            font-weight: 900;
            color: var(--accent-gold);
            text-shadow: 0 0 15px var(--glow-gold);
        }

        .metric-sub {
            font-size: 0.75rem;
            color: var(--text-secondary);
        }

        /* アトミック一括スイーパー */
        .sweep-bar {
            background: linear-gradient(90deg, rgba(243,186,47,0.08), rgba(0,242,254,0.08));
            border: 2px solid var(--accent-gold);
            border-radius: 14px;
            padding: 20px 24px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 16px;
        }

        @media (max-width: 768px) {
            .sweep-bar { flex-direction: column; align-items: flex-start; }
        }

        .sweep-btn {
            background: linear-gradient(135deg, var(--accent-gold), var(--accent-cyan));
            color: #000;
            border: none;
            padding: 12px 24px;
            border-radius: 10px;
            font-weight: 900;
            font-size: 0.9rem;
            cursor: pointer;
            transition: all 0.3s;
            box-shadow: 0 4px 15px rgba(243, 186, 47, 0.3);
            white-space: nowrap;
        }

        .sweep-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 25px var(--glow-gold);
        }

        /* SNS QLUX 投稿ストリーム */
        .sns-box {
            display: flex;
            flex-direction: column;
            gap: 14px;
        }

        .sns-textarea {
            background: var(--bg-deep);
            border: 1px solid var(--border-color);
            border-radius: 12px;
            padding: 16px;
            color: var(--text-primary);
            font-size: 0.9rem;
            resize: none;
            height: 100px;
            outline: none;
            transition: border-color 0.3s;
        }

        .sns-textarea:focus { border-color: var(--accent-cyan); }

        .sns-footer {
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .action-btn {
            background: linear-gradient(135deg, var(--accent-cyan), var(--accent-green));
            color: #000;
            border: none;
            padding: 10px 22px;
            border-radius: 10px;
            font-weight: 900;
            font-size: 0.85rem;
            cursor: pointer;
            transition: all 0.3s;
        }

        .action-btn:hover { transform: translateY(-2px); box-shadow: 0 0 20px var(--glow-cyan); }

        /* タイムライン */
        .timeline-list {
            display: flex;
            flex-direction: column;
            gap: 12px;
            margin-top: 10px;
        }

        .timeline-item {
            background: var(--surface-hover);
            border: 1px solid var(--border-color);
            border-radius: 12px;
            padding: 16px 20px;
            display: flex;
            flex-direction: column;
            gap: 8px;
        }

        .timeline-author {
            font-size: 0.8rem;
            font-weight: 700;
            color: var(--accent-cyan);
            display: flex;
            justify-content: space-between;
        }

        .timeline-content {
            font-size: 0.9rem;
            color: var(--text-primary);
        }

        /* ログインモーダル */
        .modal-overlay {
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(3, 3, 8, 0.85);
            backdrop-filter: blur(12px);
            display: none;
            justify-content: center;
            align-items: center;
            z-index: 2000;
        }

        .modal-card {
            background: var(--surface);
            border: 2px solid var(--accent-gold);
            border-radius: 20px;
            padding: 36px;
            width: 90%;
            max-width: 440px;
            display: flex;
            flex-direction: column;
            gap: 20px;
            box-shadow: 0 20px 60px rgba(0,0,0,0.9);
        }

        .modal-title {
            font-size: 1.2rem;
            font-weight: 900;
            color: var(--accent-gold);
            text-align: center;
            letter-spacing: 0.1em;
        }

        .login-option-btn {
            background: var(--surface-hover);
            border: 1px solid var(--border-color);
            color: var(--text-primary);
            padding: 14px 20px;
            border-radius: 12px;
            font-weight: 700;
            font-size: 0.9rem;
            cursor: pointer;
            transition: all 0.3s;
            display: flex;
            align-items: center;
            justify-content: space-between;
        }

        .login-option-btn:hover {
            border-color: var(--accent-cyan);
            background: linear-gradient(135deg, rgba(0,242,254,0.1), rgba(243,186,47,0.1));
        }

        footer {
            text-align: center;
            padding: 28px;
            font-size: 0.75rem;
            color: var(--text-secondary);
            border-top: 1px solid var(--border-color);
            background: var(--surface);
        }
    </style>
</head>
<body>

        <div class="brand">
