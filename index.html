<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Qlux — Sovereign Global Yield Engine & Autonomous Core</title>
<style>
* { box-sizing: border-box; margin: 0; padding: 0; }
body {
    background-color: #020409;
    color: #e2e8f0;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
    padding: 32px 16px;
    display: flex;
    justify-content: center;
    overflow-x: hidden;
}
.qlux-wrapper {
    width: 100%;
    max-width: 1440px;
    display: flex;
    flex-direction: column;
    gap: 32px;
}

/* ヘッダー */
.qlux-header {
    background: linear-gradient(135deg, #090e22 0%, #020409 100%);
    border: 1px solid rgba(59, 130, 246, 0.4);
    border-radius: 20px;
    padding: 32px 48px;
    display: flex;
    justify-content: space-between;
    align-items: center;
    box-shadow: 0 15px 50px rgba(0, 0, 0, 0.9), inset 0 1px 0 rgba(255, 255, 255, 0.15);
}
.qlux-brand {
    display: flex;
    align-items: center;
    gap: 20px;
}
.qlux-logo {
    width: 56px;
    height: 56px;
    background: linear-gradient(135deg, #3b82f6 0%, #1d4ed8 100%);
    border-radius: 14px;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 28px;
    color: #fff;
    font-weight: 900;
    box-shadow: 0 0 30px rgba(59, 130, 246, 0.7);
}
.qlux-title h1 { font-size: 26px; font-weight: 900; color: #fff; letter-spacing: 0.1em; text-transform: uppercase; }
.qlux-title span { font-size: 11px; color: #3b82f6; font-family: monospace; letter-spacing: 3px; font-weight: bold; }

.qlux-status-badge {
    background: rgba(16, 185, 129, 0.1);
    border: 1px solid rgba(16, 185, 129, 0.4);
    color: #34d399;
    padding: 10px 20px;
    border-radius: 30px;
    font-size: 12px;
    font-weight: 800;
    font-family: monospace;
    display: flex;
    align-items: center;
    gap: 10px;
}
.qlux-pulse {
    width: 8px;
    height: 8px;
    background-color: #34d399;
    border-radius: 50%;
    box-shadow: 0 0 12px #34d399;
    animation: qluxPulse 1.2s infinite;
}
@keyframes qluxPulse {
    0% { transform: scale(0.9); opacity: 0.7; }
    50% { transform: scale(1.4); opacity: 1; box-shadow: 0 0 20px #34d399; }
    100% { transform: scale(0.9); opacity: 0.7; }
}

/* グリッドレイアウト */
.qlux-grid-2 { display: grid; grid-template-columns: 2fr 1fr; gap: 24px; }
.qlux-grid-3 { display: grid; grid-template-columns: repeat(3, 1fr); gap: 24px; }
.qlux-grid-4 { display: grid; grid-template-columns: repeat(4, 1fr); gap: 20px; }
@media(max-width: 1024px) {
    .qlux-grid-2, .qlux-grid-3 { grid-template-columns: 1fr; }
    .qlux-grid-4 { grid-template-columns: 1fr 1fr; }
}

.qlux-panel {
    background: #060a17;
    border: 1px solid rgba(255, 255, 255, 0.08);
    border-radius: 20px;
    padding: 32px;
    box-shadow: 0 20px 50px rgba(0,0,0,0.6);
    display: flex;
    flex-direction: column;
    gap: 24px;
}
.qlux-panel-header {
    font-size: 15px;
    font-weight: 800;
    color: #fff;
    display: flex;
    align-items: center;
    gap: 12px;
    letter-spacing: 0.05em;
    border-bottom: 1px solid rgba(255, 255, 255, 0.08);
    padding-bottom: 16px;
    text-transform: uppercase;
}

/* メトリクスカード */
.qlux-metric {
    background: #03060f;
    border: 1px solid rgba(255, 255, 255, 0.06);
    border-radius: 14px;
    padding: 20px;
    display: flex;
    flex-direction: column;
    gap: 6px;
}
.qlux-metric label { font-size: 10px; color: #64748b; font-family: monospace; letter-spacing: 0.1em; }
.qlux-metric .val { font-size: 20px; font-weight: 900; color: #3b82f6; font-family: monospace; }
.qlux-metric .sub { font-size: 10px; color: #34d399; font-family: monospace; }

/* キネティック・スワイプ */
.qlux-swipe-track {
    position: relative;
    width: 100%;
    height: 80px;
    background: #010206;
    border-radius: 16px;
    padding: 6px;
    overflow: hidden;
    border: 2px solid rgba(59, 130, 246, 0.6);
    box-shadow: inset 0 6px 25px rgba(0,0,0,0.9);
    user-select: none;
    touch-action: none;
}
.qlux-swipe-thumb {
    position: absolute;
    left: 6px;
    top: 6px;
    width: 68px;
    height: 68px;
    background: linear-gradient(135deg, #3b82f6 0%, #1d4ed8 100%);
    border-radius: 10px;
    cursor: grab;
    display: flex;
    align-items: center;
    justify-content: center;
    color: #fff;
    font-size: 28px;
    font-weight: 900;
    box-shadow: 0 4px 20px rgba(59, 130, 246, 0.8);
    z-index: 30;
    touch-action: none;
    transition: transform 0.05s ease, background 0.3s;
}
.qlux-swipe-thumb:active { cursor: grabbing; }
.qlux-swipe-thumb.unlocked {
    background: linear-gradient(135deg, #10b981, #047857);
    box-shadow: 0 0 35px rgba(16, 185, 129, 0.9);
}
.qlux-swipe-instruction {
    position: absolute;
    width: 100%;
    height: 100%;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 12px;
    font-weight: 800;
    letter-spacing: 0.15em;
    color: #60a5fa;
    opacity: 0.9;
    transition: opacity 0.2s;
    pointer-events: none;
    z-index: 10;
}
.qlux-swipe-instruction.hide { opacity: 0; }
.qlux-swipe-progress {
    position: absolute;
    left: 0;
    top: 0;
    height: 100%;
    background: rgba(59, 130, 246, 0.25);
    border-radius: 14px;
    width: 0%;
    pointer-events: none;
    z-index: 5;
}

.qlux-terminal {
    background: #000;
    border: 1px solid #10b981;
    border-radius: 14px;
    padding: 20px;
    font-family: monospace;
    font-size: 12px;
    color: #34d399;
    display: none;
    line-height: 1.6;
    box-shadow: inset 0 0 30px rgba(16, 185, 129, 0.15);
}

/* ライブ収益カウンター */
.live-counter-box {
    background: #000;
    border: 1px solid #3b82f6;
    border-radius: 12px;
    padding: 16px;
    display: flex;
    justify-content: space-between;
    align-items: center;
    font-family: monospace;
}
.live-counter-val {
    font-size: 18px;
    font-weight: 900;
    color: #34d399;
}

/* 統合カード */
.mega-card {
    background: #03060f;
    border: 1px solid rgba(255, 255, 255, 0.06);
    border-radius: 16px;
    padding: 24px;
    display: flex;
    flex-direction: column;
    gap: 12px;
    transition: all 0.2s ease;
}
.mega-card:hover {
    border-color: rgba(59, 130, 246, 0.6);
    background: #050a18;
    transform: translateY(-2px);
}
