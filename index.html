<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>QLUX — Supreme BSV Neural Megalopolis & On-Chain Social Hub</title>
    <style>
        :root {
            --bg-deep: #020206;
            --surface: #090914;
            --surface-hover: #121226;
            --accent-cyan: #00f2fe;
            --accent-gold: #f3ba2f;
            --accent-magenta: #ff007f;
            --accent-green: #00ff66;
            --text-primary: #f5f5fc;
            --text-secondary: #8c8cbc;
            --border-color: rgba(255, 255, 255, 0.08);
            --glow-gold: rgba(243, 186, 47, 0.4);
            --glow-cyan: rgba(0, 242, 254, 0.4);
            --glow-magenta: rgba(255, 0, 127, 0.4);
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Inter', system-ui, -apple-system, sans-serif;
        }

        body {
            background-color: var(--bg-deep);
            color: var(--text-primary);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            line-height: 1.6;
        }

        /* ヘッダー */
        header {
            background: var(--surface);
            border-bottom: 1px solid var(--border-color);
            padding: 16px 32px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            position: sticky;
            top: 0;
            z-index: 1000;
            backdrop-filter: blur(24px);
        }

        .brand {
            display: flex;
            align-items: center;
            gap: 14px;
        }

        .brand-logo {
            width: 46px;
            height: 46px;
            background: linear-gradient(135deg, var(--accent-gold), var(--accent-magenta));
            border-radius: 12px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: 900;
            font-size: 1.5rem;
            color: #fff;
            box-shadow: 0 0 25px var(--glow-gold);
        }

        .brand-title h1 {
            font-size: 1.2rem;
            font-weight: 900;
            letter-spacing: 0.1em;
            background: linear-gradient(90deg, #fff, var(--accent-gold));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .brand-title p {
            font-size: 0.55rem;
            color: var(--text-secondary);
            letter-spacing: 0.18em;
        }

        .auth-widget {
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .user-pill {
            background: rgba(0, 255, 102, 0.08);
            border: 1px solid var(--accent-green);
            padding: 8px 16px;
            border-radius: 30px;
            font-size: 0.78rem;
            color: var(--accent-green);
            font-weight: 700;
            display: flex;
            align-items: center;
            gap: 6px;
        }

        .auth-main-btn {
            background: linear-gradient(135deg, var(--accent-gold), var(--accent-magenta));
            color: #fff;
            border: none;
            padding: 9px 18px;
            border-radius: 10px;
            font-weight: 900;
            font-size: 0.82rem;
            cursor: pointer;
            transition: all 0.3s;
            box-shadow: 0 4px 15px rgba(243, 186, 47, 0.3);
        }

        .auth-main-btn:hover { transform: translateY(-2px); box-shadow: 0 6px 25px var(--glow-gold); }

        /* タブナビゲーション */
        .nav-tabs {
            background: var(--surface);
            border-bottom: 1px solid var(--border-color);
            padding: 12px 32px;
            display: flex;
            gap: 10px;
            overflow-x: auto;
            white-space: nowrap;
        }

        .nav-tab {
            background: var(--surface-hover);
            border: 1px solid var(--border-color);
            color: var(--text-secondary);
            padding: 10px 18px;
            border-radius: 10px;
            font-size: 0.82rem;
            font-weight: 700;
            cursor: pointer;
            transition: all 0.3s;
            text-decoration: none;
            display: inline-flex;
            align-items: center;
            gap: 6px;
        }

        .nav-tab:hover, .nav-tab.active {
            background: linear-gradient(135deg, rgba(243,186,47,0.15), rgba(0,242,254,0.15));
            border-color: var(--accent-gold);
            color: var(--text-primary);
            box-shadow: 0 0 15px var(--glow-gold);
        }

        /* メインキャンバス */
        main {
            flex: 1;
            max-width: 1300px;
            width: 100%;
            margin: 0 auto;
            padding: 32px;
            display: flex;
            flex-direction: column;
            gap: 28px;
        }

        .card {
            background: var(--surface);
            border: 1px solid var(--border-color);
            border-radius: 18px;
            padding: 32px;
            display: flex;
            flex-direction: column;
            gap: 20px;
            box-shadow: 0 14px 45px rgba(0,0,0,0.8);
            position: relative;
            overflow: hidden;
        }

        .card::before {
            content: '';
            position: absolute;
            top: 0; left: 0; width: 4px; height: 100%;
            background: linear-gradient(to bottom, var(--accent-gold), var(--accent-cyan));
        }

        .card-header {
            font-size: 0.9rem;
            font-weight: 900;
            color: var(--accent-gold);
            text-transform: uppercase;
            letter-spacing: 0.12em;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .editorial-text {
            font-size: 0.92rem;
            color: var(--text-secondary);
            line-height: 1.8;
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        .editorial-text strong { color: var(--text-primary); }

        .grid-3 {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(260px, 1fr));
            gap: 20px;
        }

        .metric-box {
            background: linear-gradient(135deg, rgba(243,186,47,0.04), rgba(0,242,254,0.02));
            border: 1px solid var(--border-color);
            border-radius: 14px;
            padding: 20px;
            display: flex;
            flex-direction: column;
            gap: 6px;
        }

        .metric-label {
            font-size: 0.72rem;
            color: var(--text-secondary);
            text-transform: uppercase;
            letter-spacing: 0.08em;
        }

        .metric-value {
            font-size: 1.85rem;
            font-weight: 900;
            color: var(--accent-gold);
            text-shadow: 0 0 15px var(--glow-gold);
        }

        .metric-sub {
            font-size: 0.78rem;
            color: var(--text-secondary);
        }

        /* 🚀 マネージャーを超えた究極のサイバネティック・スワイプ決済バー (Swipe-to-Pay) */
        .cyber-swipe-container {
            background: linear-gradient(135deg, rgba(0,242,254,0.06), rgba(243,186,47,0.06));
            border: 2px solid var(--accent-cyan);
            border-radius: 16px;
            padding: 24px;
            display: flex;
            flex-direction: column;
            gap: 14px;
            box-shadow: 0 0 25px rgba(0, 242, 254, 0.15);
        }

        .swipe-track {
            background: var(--bg-deep);
            border: 1px solid var(--border-color);
            border-radius: 40px;
            height: 56px;
            position: relative;
            display: flex;
            align-items: center;
            padding: 0 8px;
            overflow: hidden;
            cursor: pointer;
        }

        .swipe-thumb {
            width: 140px;
            height: 40px;
            background: linear-gradient(135deg, var(--accent-cyan), var(--accent-gold));
            border-radius: 30px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: 900;
            font-size: 0.8rem;
            color: #000;
            position: absolute;
            left: 8px;
            transition: transform 0.3s cubic-bezier(0.1, 0.9, 0.2, 1);
            box-shadow: 0 0 20px var(--glow-cyan);
            user-select: none;
        }

        .swipe-label {
            width: 100%;
            text-align: center;
            font-size: 0.85rem;
            font-weight: 700;
            color: var(--text-secondary);
            letter-spacing: 0.08em;
            z-index: 1;
        }

        /* SNS QLUX プレミアム・オンス・ストリーム (Twetchを超越した高機能) */
        .sns-wrapper {
            display: flex;
            flex-direction: column;
            gap: 18px;
        }

        .sns-input-box {
            background: var(--bg-deep);
            border: 1px solid var(--border-color);
            border-radius: 14px;
            padding: 18px;
            display: flex;
            flex-direction: column;
            gap: 12px;
            transition: border-color 0.3s;
        }

        .sns-input-box:focus-within { border-color: var(--accent-magenta); }

        .sns-textarea {
            background: transparent;
            border: none;
            color: var(--text-primary);
            font-size: 0.95rem;
            resize: none;
            height: 100px;
            outline: none;
        }

        .sns-toolbar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-top: 1px solid var(--border-color);
            padding-top: 12px;
        }

        .sns-tools-left {
            display: flex;
            gap: 12px;
            font-size: 0.78rem;
            color: var(--accent-cyan);
            font-weight: 700;
        }

        .sns-post-btn {
            background: linear-gradient(135deg, var(--accent-magenta), var(--accent-cyan));
            color: #fff;
            border: none;
            padding: 10px 24px;
            border-radius: 10px;
            font-weight: 900;
            font-size: 0.85rem;
            cursor: pointer;
            transition: all 0.3s;
            box-shadow: 0 4px 15px var(--glow-magenta);
        }

        .sns-post-btn:hover { transform: translateY(-2px); box-shadow: 0 6px 25px var(--glow-cyan); }

        /* タイムラインカード */
        .feed-list {
            display: flex;
            flex-direction: column;
            gap: 14px;
        }

        .feed-card {
            background: var(--surface-hover);
            border: 1px solid var(--border-color);
            border-radius: 14px;
            padding: 20px;
            display: flex;
            flex-direction: column;
            gap: 12px;
            transition: border-color 0.3s;
        }

        .feed-card:hover { border-color: rgba(255, 255, 255, 0.2); }

        .feed-header {
