* { box-sizing: border-box; margin: 0; padding: 0; }
body {
    background-color: #02040a;
    color: #f1f5f9;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
    padding: 24px;
    display: flex;
    justify-content: center;
    overflow-x: hidden;
}
.supreme-container {
    width: 100%;
    max-width: 1320px;
    display: flex;
    flex-direction: column;
    gap: 28px;
}

/* サトシ・アペックス ヘッダー */
header {
    background: linear-gradient(135deg, rgba(15,23,42,0.98), rgba(2,6,23,0.98));
    border: 1px solid rgba(245, 158, 11, 0.5);
    border-radius: 24px;
    padding: 32px 40px;
    display: flex;
    justify-content: space-between;
    align-items: center;
    box-shadow: 0 0 80px rgba(245, 158, 11, 0.2);
    position: relative;
    overflow: hidden;
}
header::before {
    content: '';
    position: absolute;
    top: 0; left: 0; width: 4px; height: 100%;
    background: linear-gradient(180deg, #fef08a, #f59e0b, #b45309);
}
.logo-box {
    display: flex;
    align-items: center;
    gap: 22px;
}
.logo-emblem {
    width: 72px;
    height: 72px;
    background: linear-gradient(135deg, #fef08a 0%, #f59e0b 50%, #92400e 100%);
    border-radius: 20px;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 36px;
    color: #000;
    font-weight: 900;
    box-shadow: 0 0 40px rgba(245, 158, 11, 0.7);
}
.logo-text h1 { font-size: 28px; font-weight: 900; color: #fff; letter-spacing: 0.05em; }
.logo-text span { font-size: 12px; color: #f59e0b; font-family: monospace; letter-spacing: 3px; }

.live-badge {
    background: rgba(16, 185, 129, 0.15);
    border: 1px solid rgba(16, 185, 129, 0.6);
    color: #34d399;
    padding: 12px 24px;
    border-radius: 30px;
    font-size: 13px;
    font-weight: 900;
    display: flex;
    align-items: center;
    gap: 12px;
    font-family: monospace;
    box-shadow: 0 0 25px rgba(16, 185, 129, 0.25);
}
.pulse-dot {
    width: 12px;
    height: 12px;
    background-color: #34d399;
    border-radius: 50%;
    box-shadow: 0 0 15px #34d399;
    animation: beacon 1.4s infinite;
}
@keyframes beacon {
    0% { transform: scale(0.9); opacity: 0.7; }
    50% { transform: scale(1.35); opacity: 1; box-shadow: 0 0 20px #34d399; }
    100% { transform: scale(0.9); opacity: 0.7; }
}

/* カードパネル共通 */
.mega-card {
    background: rgba(8, 13, 26, 0.95);
    border: 1px solid rgba(245, 158, 11, 0.35);
    border-radius: 28px;
    padding: 36px;
    box-shadow: 0 20px 60px rgba(0, 0, 0, 0.85);
    backdrop-filter: blur(30px);
    display: flex;
    flex-direction: column;
    gap: 28px;
}
.card-header-title {
    font-size: 19px;
    font-weight: 900;
    color: #fff;
    display: flex;
    align-items: center;
    gap: 14px;
    letter-spacing: 0.04em;
    border-bottom: 1px solid rgba(255,255,255,0.08);
    padding-bottom: 16px;
}

.grid-2 { display: grid; grid-template-columns: 1fr 1fr; gap: 20px; }
